<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="sample.js"></script>
</head>
<body>
    <script>
        let a= 20;
        let b= 5;
        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a**b);
        console.log(a/b);
        console.log(a%b);
        a++;
        console.log(a);
        b--;
        console.log(b);
        let x="2";
        let y=2;
        console.log(x!==y);
        let n1=5;
        let n2=10;
        console.log(n1>n2);
        console.log(n1<n2);
        console.log(n1>=n2);
        console.log(n1<=n2);
        console.log(n1==n2);
        console.log(n1===n2);
        console.log(n1!=n2);
        console.log(n1!==n2);
        let c=30;
        c+=2;
        console.log(c);
        c-=3;
        console.log(c);
        c*=5;
        console.log(c);
        c/=5;
        console.log(c);
        c%=3;
        console.log(c);
        c**=2;
        console.log(c);
        let d=20;
        let e=30;
        console.log(d>3 && e>40);
        console.log(d>3 || e>50);
        console.log(!(d<5));
        //conditions
        let amount=40;
        if(amount>30){
            console.log("eligible for loan");
        }
        let m=30;
        if(m>90){
            console.log("Grade: o")
        }
        else if(m>80){
            console.log("Grade: A+")
        }
        else if(m>85){
            console.log("Grade: A")
        }
        else if(m>70){
            console.log("Grade: B")
        }
        else if(m>60){
            console.log("Grade: C")
        }
        else{
            console.log("Fail")
        }
        //switch case statments
        let s=3
        switch(s){
            case 1:
                console.log("summer")
                break;
            case 2:
                console.log("Winter")
                break;
            case 3:
                console.log("spring")
                break;
            case 4:
                console.log("Rainy")
                break;
            default:
                console.log("normal")
            }
            //nested if 
            let weather="rainy";
            let temp=20;
            if(weather === "sunny"){
                if(temp>30){
                    console.log("it is a wrm day")
                }
                else if(temp>20){
                    console.log("it is a hot day")
                }
                else{
                    console.log("it is it cool")
                }
            }
            else if(weather=== "rainy"){
                console.log("Dont forget your umbrella")
            }
            else{
                console.log("check the weather forecast")
            }
            // loop statements
            for(let i=0;i<5;i++){
                console.log("good morning")
                console.log(i)
            }
            let n=0;
            while(n<5){
                n+=1;
                console.log(n)
            }
            let p=0;
            do{
                p+=1;
                console.log(p)
            } while(p<5 )
            // array
            let fruits=["Apple","Banana","Strawberry"];
            console.log(fruits);
            fruits.push("orange");
            console.log(fruits);
            fruits.pop()
            console.log(fruits)
            fruits.unshift("graphes")
            console.log(fruits)
            fruits.shift()
            console.log(fruits)
            fruits.splice(2,0,"lemom","kiwi");
            console.log(fruits)
            fruits.splice(0,1);
            console.log(fruits)
            const citrus=fruits.slice(2,3)
            console.log(citrus)
            let f=[1,2,3];
            let g=[4,5,6];
            let h=f.concat(g)
            console.log(h);
            console.log(g,...f)

            //object
            let details={
                firstname:"Manolashini",
                lastname:"V",
                age: 20,
                dept:"Software developer",
            };
            console.log(details);
            //nested objects
            let p2={
                fname:"mano",
                lname:"lashini",
                address: {
                    post:"Kamalapuram",
                    taluk:"Omalur",
                    district:"Salem"
                }
            }
            console.log(p2);
            console.log(p2.address.district);
            let p3=[{
                fname:"mano",
                lname:"lashini" },{
                    post:"Kamalapuram",
                    taluk:"Omalur",
                    district:"Salem"
                }]
                console.log(p3);
                console.log(p3[1]);

            //function declaration
            function greet(name){
                console.log("hello ",name)
            }
            greet("mano");
            // function expression
            const greet1= function(name){
                console.log("hello", name)
            }
            greet1("lashini");
            //  Arrow function
            const greet2=(name)=>{
                console.log("welcome",name);
            }
            greet2("Manolashini");
    </script>     
    </body>
</html>
